apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "taskapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http          # ServiceMonitor refers to this port by name
      port: {{ .Values.service.port }}
      targetPort: http
