# Jenkins Configuration as Code. Values like ${JENKINS_ADMIN_PASSWORD} come
# from environment variables (jenkins/.env) -> secrets never live in Git.
jenkins:
  systemMessage: "TaskApp CI - configured by JCasC"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-creds
              username: ${DOCKERHUB_USER}
              password: ${DOCKERHUB_TOKEN}
              description: Docker Hub push token
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
              description: GitHub PAT (repo scope) to push the image-tag bump

jobs:
  - script: |
      pipelineJob('taskapp') {
        description('Build, test, scan, push TaskApp and bump the Helm image tag (GitOps)')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL}')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
